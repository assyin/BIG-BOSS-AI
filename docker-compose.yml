services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: bigboss-postgres
    environment:
      POSTGRES_DB: bigbossfitness
      POSTGRES_USER: bigboss
      POSTGRES_PASSWORD: bigboss_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bigboss -d bigbossfitness"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bigboss-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: bigboss-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bigboss-network

  # ASP.NET Core API (optional - for full docker dev)
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bigboss-api
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - BBF_DATABASE_URL=postgresql://bigboss:bigboss_dev_password@postgres:5432/bigbossfitness
      - BBF_REDIS_CONNECTION=redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bigboss-network
    profiles:
      - full

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  bigboss-network:
    driver: bridge
